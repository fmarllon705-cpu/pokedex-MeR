<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex Física & Virtual</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Fonte Retro Gamer -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container py-3 max-w-mobile">
    <!-- CORPO DA POKÉDEX -->
    <div class="card pokedex-main-card shadow-lg border-dark border-3 rounded-4 overflow-hidden">
      
      <!-- HEADER COM SENSOR -->
      <div class="card-header pokedex-header d-flex align-items-center gap-3 py-3 px-3">
        <div class="sensor-light position-relative">
          <div class="sensor-glare"></div>
        </div>
        <h1 class="h5 m-0 text-white text-uppercase tracking-wider pokedex-title">
          Pokédex <span class="badge bg-warning text-dark fs-6 ms-1">Marllon & Redely</span>
        </h1>
      </div>

      <div class="card-body p-3 d-flex flex-column gap-3">

        <!-- PAINEL DE BUSCA -->
        <section class="card bg-light border-2 border-dark shadow-sm">
          <div class="card-body p-3">
            <div class="mb-3">
              <label for="section-select" class="form-label fw-bold text-uppercase fs-7 text-secondary">
                <i class="bi bi-journal-bookmark-fill text-danger me-1"></i> Seção do Fichário
              </label>
              <select id="section-select" class="form-select form-select-lg border-2 shadow-none fs-6 fw-bold">
                <option value="main">1. Pokédex Completa (Folhas 1-60)</option>
                <option value="fullart">2. Full Arts (Folhas 61-75)</option>
                <option value="valuable">3. Valiosas +R$50 (Folhas 76-88)</option>
                <option value="cute">4. Fofos / Bonitos (Folhas 89-100)</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="pokemon-input" class="form-label fw-bold text-uppercase fs-7 text-secondary">
                <i class="bi bi-search text-primary me-1"></i> Nome ou Número
              </label>
              <input type="text" id="pokemon-input" class="form-select-lg form-control border-2 shadow-none fs-6" placeholder="Ex: Whimsicoot ou 547">
            </div>

            <button id="btn-search" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2">
              <i class="bi bi-lightning-charge-fill"></i> Localizar Pokémon
            </button>
          </div>
        </section>

        <!-- PAINEL DE RESULTADOS (TELA LCD) -->
        <section class="card lcd-screen border-3 border-dark text-white shadow-inner">
          <div class="card-body p-3 text-center">
            
            <!-- PREVIEW CARD -->
            <div class="pokemon-preview mb-3 position-relative">
              <div class="poke-img-wrapper mx-auto mb-2 d-flex align-items-center justify-content-center">
                <img id="poke-img" src="" alt="Imagem do Pokémon" style="display:none;">
                <i id="poke-placeholder-icon" class="bi bi-question-circle text-muted fs-1"></i>
              </div>
              <h3 id="poke-name" class="h5 fw-bold text-warning text-capitalize m-0">Digite um Pokémon</h3>
              <span id="poke-id-display" class="badge bg-secondary text-light mt-1">#000</span>
            </div>

            <!-- LOCALIZAÇÃO EXATA (BADGES) -->
            <div class="location-box p-2 rounded-3 bg-dark bg-opacity-50 border border-secondary mb-3">
              <div class="row g-1 text-center">
                <div class="col-4">
                  <span class="d-block text-muted fs-8 text-uppercase fw-bold">Folha</span>
                  <span id="res-sheet" class="fs-5 fw-bold text-warning">-</span>
                </div>
                <div class="col-4 border-start border-end border-secondary">
                  <span class="d-block text-muted fs-8 text-uppercase fw-bold">Lado</span>
                  <span id="res-side" class="fs-5 fw-bold text-info">-</span>
                </div>
                <div class="col-4">
                  <span class="d-block text-muted fs-8 text-uppercase fw-bold">Bolso</span>
                  <span id="res-pocket" class="fs-5 fw-bold text-success">-</span>
                </div>
              </div>
            </div>

            <!-- GRID 3x3 -->
            <div class="binder-grid p-2 rounded-3 bg-black border border-secondary" id="binder-grid">
              <div class="pocket" data-pocket="1">1</div>
              <div class="pocket" data-pocket="2">2</div>
              <div class="pocket" data-pocket="3">3</div>
              <div class="pocket" data-pocket="4">4</div>
              <div class="pocket" data-pocket="5">5</div>
              <div class="pocket" data-pocket="6">6</div>
              <div class="pocket" data-pocket="7">7</div>
              <div class="pocket" data-pocket="8">8</div>
              <div class="pocket" data-pocket="9">9</div>
            </div>

            <button id="btn-save" class="btn btn-success btn-lg w-100 fw-bold mt-3 shadow-sm" style="display: none;">
              <i class="bi bi-plus-circle-fill me-1"></i> Adicionar à Coleção
            </button>
          </div>
        </section>

        <!-- MINHA COLEÇÃO VIRTUAL -->
        <section class="card bg-dark text-white border-2 border-dark shadow-sm">
          <div class="card-header bg-black bg-opacity-50 d-flex justify-content-between align-items-center py-2 px-3">
            <h2 class="h6 m-0 fw-bold text-uppercase text-light">
              <i class="bi bi-collection-play-fill text-warning me-1"></i> Pokédex Virtual
            </h2>
            <span class="badge bg-danger rounded-pill fs-7" id="collection-count">0</span>
          </div>
          <div class="card-body p-2">
            <div class="collection-grid" id="collection-grid">
              <!-- Cards dinamicos -->
            </div>
          </div>
        </section>

      </div>
    </div>
  </div>
  
  <!-- Importando Firebase (Módulos Compatibility para JS simples) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script src="script.js"></script>

</body>
</html>
