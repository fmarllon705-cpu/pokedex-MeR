<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>

  <!-- Bootstrap CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-body-tertiary">

  <nav class="navbar navbar-dark bg-danger mb-4 shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
      <span class="navbar-brand mb-0 h1">Pokédex do Casal ❤️</span>
      <div>
        <button id="btn-theme" class="btn btn-outline-light btn-sm me-2"><i class="bi bi-moon-stars"></i></button>
        <button id="btn-backup" class="btn btn-outline-light btn-sm"><i class="bi bi-download me-1"></i> Backup</button>
      </div>
    </div>
  </nav>

  <div class="container pb-5">

    <!-- ESTATÍSTICAS E VALOR TOTAL -->
    <div class="row g-3 mb-4">
      <div class="col-md-8">
        <div class="card shadow-sm border-0 h-100">
          <div class="card-body d-flex flex-column justify-content-center">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h6 class="fw-bold mb-0">Progresso da Coleção (1.800 slots)</h6>
              <span id="progress-percent" class="badge bg-danger fs-7">0%</span>
            </div>
            <div class="progress" style="height: 18px;">
              <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated bg-danger" role="progressbar" style="width: 0%;"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow-sm border-0 bg-success text-white h-100">
          <div class="card-body d-flex align-items-center justify-content-between">
            <div>
              <small class="text-white-50 text-uppercase fw-bold">Valor da Coleção</small>
              <h3 id="total-value-display" class="fw-bold mb-0">R$ 0,00</h3>
            </div>
            <i class="bi bi-cash-coin fs-1 text-white-50"></i>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <!-- PAINEL DE BUSCA E CADASTRO -->
      <div class="col-md-5">
        <div class="card shadow-sm border-0">
          <div class="card-body">
            <h5 class="card-title fw-bold mb-3"><i class="bi bi-plus-circle me-1 text-danger"></i> Adicionar Carta</h5>
            
            <div class="mb-3">
              <label class="form-label">Seção do Fichário</label>
              <select id="section-select" class="form-select">
                <option value="main">National Dex (Folha 1+)</option>
                <option value="fullart">Full Art / Secretas (Folha 61+)</option>
                <option value="valuable">Valiosas / RARAS (Folha 76+)</option>
                <option value="cute">Fofos / Favoritos (Folha 89+)</option>
              </select>
            </div>

            <div class="input-group mb-3">
              <input type="text" id="pokemon-input" class="form-control" placeholder="Nome ou nº do Pokémon...">
              <button id="btn-search" class="btn btn-danger"><i class="bi bi-search"></i> Buscar</button>
            </div>

            <!-- CARD DE PREVIEW E DETALHES -->
            <div id="search-result" class="text-center p-3 border rounded bg-body-secondary">
              <i id="poke-placeholder-icon" class="bi bi-card-image fs-1 text-muted"></i>
              <img id="poke-img" src="" alt="" style="display: none; max-width: 110px;">
              <h5 id="poke-name" class="mt-2 text-capitalize fw-bold">-</h5>
              <p id="poke-id-display" class="text-muted small mb-2">#---</p>
              
              <!-- DETALHES DE COLECIONADOR -->
              <div id="collector-details" class="row g-2 mb-3 text-start" style="display: none;">
                <div class="col-6">
                  <label class="form-label small fw-bold mb-1">Idioma</label>
                  <select id="card-lang" class="form-select form-select-sm">
                    <option value="PT-BR">🇧🇷 PT-BR</option>
                    <option value="EN">🇺🇸 EN</option>
                    <option value="JP">🇯🇵 JP</option>
                  </select>
                </div>
                <div class="col-6">
                  <label class="form-label small fw-bold mb-1">Condição</label>
                  <select id="card-condition" class="form-select form-select-sm">
                    <option value="NM">Near Mint (NM)</option>
                    <option value="SP">Slightly Played (SP)</option>
                    <option value="MP">Moderately Played (MP)</option>
                  </select>
                </div>

                <!-- ACABAMENTO/RARIDADE (NOVO) -->
                <div class="col-12">
                  <label class="form-label small fw-bold mb-1">Acabamento / Estilo</label>
                  <select id="card-finish" class="form-select form-select-sm">
                    <option value="Normal">Normal (Regular)</option>
                    <option value="Holo">Holo ✨ (Brilhante)</option>
                    <option value="Reverse">Reverse Holo 🌟</option>
                    <option value="Ultra">Ultra Rara / Secret 💎</option>
                  </select>
                </div>

                <div class="col-6">
                  <label class="form-label small fw-bold mb-1">Nº Carta (Set)</label>
                  <input type="text" id="card-number" class="form-control form-select-sm" placeholder="ex: 005/094">
                </div>
                <div class="col-6">
                  <label class="form-label small fw-bold mb-1">Preço (R$)</label>
                  <input type="number" step="0.50" id="card-price" class="form-control form-select-sm" placeholder="ex: 15.00">
                </div>

                <div class="col-12 mt-2">
                  <div class="form-check form-switch ms-1">
                    <input class="form-check-input" type="checkbox" id="card-shiny">
                    <label class="form-check-label small fw-bold" for="card-shiny">Versão Shiny ✨</label>
                  </div>
                </div>
              </div>

              <div class="p-2 border rounded bg-body mb-3">
                <small class="d-block text-muted">Posição Recomendada:</small>
                <strong>Folha: <span id="res-sheet">-</span> | Lado: <span id="res-side">-</span> | Bolso: <span id="res-pocket">-</span></strong>
              </div>

              <button id="btn-save" class="btn btn-success w-100 fw-bold" style="display: none;">
                <i class="bi bi-cloud-arrow-up me-1"></i> Salvar na Nuvem
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- LISTA DE CARDS COM FILTROS E BUSCA INTERNA -->
      <div class="col-md-7">
        <div class="card shadow-sm border-0">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="card-title fw-bold mb-0">
                Cartas (<span id="collection-count">0</span>)
              </h5>
            </div>

            <!-- BARRA DE FILTROS E BUSCA INTERNA (ATUALIZADA) -->
            <div class="row g-2 mb-3">
              <div class="col-12">
                <div class="input-group input-group-sm">
                  <span class="input-group-text"><i class="bi bi-search"></i></span>
                  <input type="text" id="search-saved" class="form-control" placeholder="Buscar no fichário por nome...">
                </div>
              </div>
              <div class="col-5">
                <select id="filter-section" class="form-select form-select-sm">
                  <option value="all">Todas Seções</option>
                  <option value="main">National Dex</option>
                  <option value="fullart">Full Art</option>
                  <option value="valuable">Valiosas</option>
                  <option value="cute">Fofos</option>
                </select>
              </div>
              <div class="col-3">
                <input type="number" id="filter-sheet" class="form-control form-select-sm" placeholder="Folha..." min="1">
              </div>
              <div class="col-4">
                <select id="sort-order" class="form-select form-select-sm">
                  <option value="sheet">Ord: Folha</option>
                  <option value="price-desc">R$ Maior ➔ Menor</option>
                  <option value="recent">Mais Recentes</option>
                </select>
              </div>
            </div>

            <!-- GRID DE CARTAS -->
            <div id="collection-grid" class="d-flex flex-wrap gap-2"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase Legacy SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="script.js"></script>
</body>
</html>
