<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>

  <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><defs><linearGradient id='bg' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%23dc0a2d'/><stop offset='100%' stop-color='%238e0018'/></linearGradient><linearGradient id='pr' x1='0%' y1='0%' x2='0%' y2='100%'><stop offset='0%' stop-color='%23ff1c1c'/><stop offset='100%' stop-color='%23990000'/></linearGradient></defs><rect width='512' height='512' rx='110' fill='url(%23bg)'/><rect x='96' y='80' width='320' height='352' rx='24' fill='%23ffde00' stroke='%23000' stroke-width='12'/><circle cx='96' cy='140' r='14' fill='%23444' stroke='%23000' stroke-width='6'/><circle cx='96' cy='256' r='14' fill='%23444' stroke='%23000' stroke-width='6'/><circle cx='96' cy='372' r='14' fill='%23444' stroke='%23000' stroke-width='6'/><path d='M 166 256 A 90 90 0 0 1 346 256 Z' fill='url(%23pr)' stroke='%23000' stroke-width='12'/><path d='M 166 256 A 90 90 0 0 0 346 256 Z' fill='%23fff' stroke='%23000' stroke-width='12'/><line x1='166' y1='256' x2='346' y2='256' stroke='%23000' stroke-width='12'/><circle cx='256' cy='256' r='28' fill='%23fff' stroke='%23000' stroke-width='10'/><path d='M 256 264 C 256 264 244 256 244 250 C 244 246 248 243 252 244 C 254 245 256 247 256 247 C 256 247 258 245 260 244 C 264 243 268 246 268 250 C 268 256 256 264 256 264 Z' fill='%23dc0a2d'/></svg>">

  <!-- Bootstrap CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-body-tertiary">

  <nav class="navbar navbar-dark bg-danger mb-4 shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
      <span class="navbar-brand mb-0 h1">Pokédex do Casal ❤️</span>
      <div>
        <button id="btn-theme" class="btn btn-outline-light btn-sm me-2"><i class="bi bi-moon-stars"></i></button>
        <button id="btn-backup" class="btn btn-outline-light btn-sm"><i class="bi bi-download me-1"></i> Backup</button>
      </div>
    </div>
  </nav>

  <div class="container pb-5">

    <!-- BARRA DE PROGRESSO DA COLEÇÃO -->
    <div class="card mb-4 shadow-sm border-0">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="fw-bold mb-0">Progresso da Coleção (1.800 slots)</h6>
          <span id="progress-percent" class="badge bg-danger fs-7">0%</span>
        </div>
        <div class="progress" style="height: 18px;">
          <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated bg-danger" role="progressbar" style="width: 0%;"></div>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <!-- PAINEL DE BUSCA -->
      <div class="col-md-5">
        <div class="card shadow-sm border-0">
          <div class="card-body">
            <h5 class="card-title fw-bold mb-3"><i class="bi bi-plus-circle me-1 text-danger"></i> Adicionar Carta</h5>
            
            <div class="mb-3">
              <label class="form-label">Seção do Fichário</label>
              <select id="section-select" class="form-select">
                <option value="main">National Dex (Folha 1+)</option>
                <option value="fullart">Full Art / Secretas (Folha 61+)</option>
                <option value="valuable">Valiosas / RARAS (Folha 76+)</option>
                <option value="cute">Fofos / Favoritos (Folha 89+)</option>
              </select>
            </div>

            <div class="input-group mb-3">
              <input type="text" id="pokemon-input" class="form-control" placeholder="Nome ou nº do Pokémon...">
              <button id="btn-search" class="btn btn-danger"><i class="bi bi-search"></i> Buscar</button>
            </div>

            <!-- CARD DE PREVIEW DA BUSCA -->
            <div id="search-result" class="text-center p-3 border rounded bg-body-secondary">
              <i id="poke-placeholder-icon" class="bi bi-card-image fs-1 text-muted"></i>
              <img id="poke-img" src="" alt="" style="display: none; max-width: 120px;">
              <h5 id="poke-name" class="mt-2 text-capitalize fw-bold">-</h5>
              <p id="poke-id-display" class="text-muted small">#---</p>
              
              <!-- DETALHES DE COLECIONADOR (NOVO) -->
              <div id="collector-details" class="row g-2 mb-3" style="display: none;">
                <div class="col-6">
                  <select id="card-lang" class="form-select form-select-sm">
                    <option value="PT-BR">🇧🇷 PT-BR</option>
                    <option value="EN">🇺🇸 EN</option>
                    <option value="JP">🇯🇵 JP</option>
                  </select>
                </div>
                <div class="col-6">
                  <select id="card-condition" class="form-select form-select-sm">
                    <option value="NM">Near Mint (NM)</option>
                    <option value="SP">Slightly Played (SP)</option>
                    <option value="MP">Moderately Played (MP)</option>
                  </select>
                </div>
                <div class="col-12">
                  <div class="form-check form-switch text-start ms-2">
                    <input class="form-check-input" type="checkbox" id="card-shiny">
                    <label class="form-check-label small fw-bold" for="card-shiny">Versão Shiny ✨</label>
                  </div>
                </div>
              </div>

              <div class="p-2 border rounded bg-body mb-3">
                <small class="d-block text-muted">Posição Recomendada:</small>
                <strong>Folha: <span id="res-sheet">-</span> | Lado: <span id="res-side">-</span> | Bolso: <span id="res-pocket">-</span></strong>
              </div>

              <button id="btn-save" class="btn btn-success w-100 fw-bold" style="display: none;">
                <i class="bi bi-cloud-arrow-up me-1"></i> Salvar na Nuvem
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- LISTA DE CARDS COM FILTROS -->
      <div class="col-md-7">
        <div class="card shadow-sm border-0">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="card-title fw-bold mb-0">
                Cartas (<span id="collection-count">0</span>)
              </h5>
            </div>

            <!-- BARRA DE FILTROS DA COLEÇÃO -->
            <div class="row g-2 mb-3">
              <div class="col-7">
                <select id="filter-section" class="form-select form-select-sm">
                  <option value="all">Todas as Seções</option>
                  <option value="main">National Dex</option>
                  <option value="fullart">Full Art / Secretas</option>
                  <option value="valuable">Valiosas</option>
                  <option value="cute">Fofos</option>
                </select>
              </div>
              <div class="col-5">
                <input type="number" id="filter-sheet" class="form-control form-select-sm" placeholder="Nº Folha..." min="1" max="100">
              </div>
            </div>

            <!-- GRID DE CARTAS -->
            <div id="collection-grid" class="d-flex flex-wrap gap-2"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase Legacy SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="script.js"></script>
</body>
</html>
