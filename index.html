<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokédex</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <h1>Minha Pokédex</h1>

    <!-- Barra de Progresso Clicável -->
    <div className="progress-card" id="progressBarCard" title="Clique para ver a coleção completa">
      <div class="progress-info">
        <span>Coleção</span>
        <span id="progressText">0 / 151 (0%)</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </div>

  <!-- Modal da Pokédex Completa -->
  <div class="modal-backdrop hidden" id="pokedexModal">
    <div class="modal-container">
      <div class="modal-header">
        <h2>Pokédex Completa</h2>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>
      <div class="pokemon-grid" id="pokemonGrid">
        <!-- Pokémon serão gerados via JavaScript -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
