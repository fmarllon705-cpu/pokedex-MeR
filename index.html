<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex do Casal ❤️</title>

  <!-- PWA Manifest & Tema -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#dc0a2d">

  <!-- Fontes e Ícones Garantidos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="pokedex-body">

  <div class="container py-4">
    <!-- ESTRUTURA DA POKÉDEX (CARCAÇA PRINCIPAL) -->
    <div class="pokedex-device shadow-lg mx-auto">
      
      <!-- TOPO DA POKÉDEX (LENS / LUZES CLÁSSICAS) -->
      <div class="pokedex-header d-flex align-items-center justify-content-between p-3">
        <div class="d-flex align-items-center gap-2">
          <div class="big-blue-lens"></div>
          <div class="mini-light bg-danger"></div>
          <div class="mini-light bg-warning"></div>
          <div class="mini-light bg-success"></div>
        </div>
        <div class="d-flex gap-2">
          <button id="btn-theme" class="btn btn-pokedex-tool btn-sm"><i class="fa-solid fa-moon"></i></button>
          <button id="btn-backup" class="btn btn-pokedex-tool btn-sm"><i class="fa-solid fa-download"></i> Backup</button>
        </div>
      </div>

      <h3 class="text-white fw-bold text-center my-2 brand-title">POKÉDEX DO CASAL ❤️</h3>

      <!-- PAINEL SUPERIOR: PROGRESSO & VALOR -->
      <div class="row g-2 px-3 mb-3">
        <div class="col-md-7">
          <div class="screen-box p-2">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <span class="screen-label"><i class="fa-solid fa-book-open"></i> Progresso Coleção</span>
              <span id="progress-percent" class="badge bg-danger">0%</span>
            </div>
            <div class="progress" style="height: 14px;">
              <div id="progress-bar" class="progress-bar bg-warning progress-bar-striped progress-bar-animated" style="width: 0%;"></div>
            </div>
          </div>
        </div>
        <div class="col-md-5">
          <div class="screen-box p-2 text-end">
            <span class="screen-label d-block"><i class="fa-solid fa-coins"></i> Valor Estimado</span>
            <h4 id="total-value-display" class="fw-bold mb-0 text-warning">R$ 0,00</h4>
          </div>
        </div>
      </div>

      <!-- CORPO PRINCIPAL (DIVIDIDO EM 2 ABAS/LADOS) -->
      <div class="row g-3 px-3 pb-3">
        
        <!-- LADO ESQUERDO: CONTROLES DE ADIÇÃO -->
        <div class="col-lg-5">
          <div class="pokedex-inner-card p-3">
            <h5 class="fw-bold text-white mb-3"><i class="fa-solid fa-plus-circle"></i> Capturar Pokémon</h5>
            
            <div class="mb-2">
              <label class="form-label text-white-50 small fw-bold mb-1">Seção do Fichário</label>
              <select id="section-select" class="form-select form-select-sm pokedex-input">
                <option value="main">National Dex (Folha 1+)</option>
                <option value="fullart">Full Art / Secretas (Folha 61+)</option>
                <option value="valuable">Valiosas / RARAS (Folha 76+)</option>
                <option value="cute">Fofos / Favoritos (Folha 89+)</option>
              </select>
            </div>

            <div class="input-group mb-3">
              <input type="text" id="pokemon-input" class="form-control form-control-sm pokedex-input" placeholder="Nome ou nº...">
              <button id="btn-search" class="btn btn-warning fw-bold"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>

            <!-- TELA GREEN SCREEN POKÉDEX PREVIEW -->
            <div id="search-result" class="pokedex-screen text-center p-3 mb-2">
              <i id="poke-placeholder-icon" class="fa-solid fa-gamepad fs-1 text-muted py-3"></i>
              <img id="poke-img" src="" alt="" style="display: none; max-width: 100px;">
              <h5 id="poke-name" class="fw-bold text-uppercase mb-0 text-dark">-</h5>
              <p id="poke-id-display" class="small mb-2 text-secondary">#---</p>
              
              <!-- FORMULÁRIO COMPLEMENTAR -->
              <div id="collector-details" class="row g-2 text-start mb-2" style="display: none;">
                <div class="col-6">
                  <label class="small fw-bold">Idioma</label>
                  <select id="card-lang" class="form-select form-select-sm">
                    <option value="PT-BR">🇧🇷 PT-BR</option>
                    <option value="EN">🇺🇸 EN</option>
                    <option value="JP">🇯🇵 JP</option>
                  </select>
                </div>
                <div class="col-6">
                  <label class="small fw-bold">Condição</label>
                  <select id="card-condition" class="form-select form-select-sm">
                    <option value="NM">Near Mint</option>
                    <option value="SP">Slightly Played</option>
                    <option value="MP">Moderately Played</option>
                  </select>
                </div>
                <div class="col-12">
                  <label class="small fw-bold">Acabamento</label>
                  <select id="card-finish" class="form-select form-select-sm">
                    <option value="Normal">Normal (Regular)</option>
                    <option value="Holo">Holo ✨</option>
                    <option value="Reverse">Reverse Holo 🌟</option>
                    <option value="Ultra">Ultra Rara 💎</option>
                  </select>
                </div>
                <div class="col-6">
                  <input type="text" id="card-number" class="form-control form-control-sm" placeholder="Nº da Carta">
                </div>
                <div class="col-6">
                  <input type="number" step="0.5" id="card-price" class="form-control form-control-sm" placeholder="Preço R$">
                </div>
                <div class="col-12">
                  <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="card-shiny">
                    <label class="form-check-label small fw-bold" for="card-shiny">Versão Shiny ✨</label>
                  </div>
                </div>
              </div>

              <!-- POSIÇÃO CALCULADA -->
              <div class="position-box p-1 rounded">
                <small class="d-block fw-bold text-uppercase">Posição no Fichário:</small>
                <span class="small fw-bold">Folha: <span id="res-sheet">-</span> | Lado: <span id="res-side">-</span> | Bolso: <span id="res-pocket">-</span></span>
              </div>
            </div>

            <button id="btn-save" class="btn btn-success w-100 fw-bold btn-pokedex-action" style="display: none;">
              <i class="fa-solid fa-floppy-disk me-1"></i> GUARDAR CARTA
            </button>
          </div>
        </div>

        <!-- LADO DIREITO: FICHÁRIO E COLEÇÃO -->
        <div class="col-lg-7">
          <div class="pokedex-inner-card p-3 h-100">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h5 class="fw-bold text-white mb-0"><i class="fa-solid fa-layer-group"></i> Fichário (<span id="collection-count">0</span>)</h5>
            </div>

            <!-- FILTROS POKÉDEX -->
            <div class="row g-2 mb-3">
              <div class="col-12">
                <div class="input-group input-group-sm">
                  <span class="input-group-text bg-dark border-secondary text-white"><i class="fa-solid fa-filter"></i></span>
                  <input type="text" id="search-saved" class="form-control pokedex-input" placeholder="Buscar no fichário...">
                </div>
              </div>
              <div class="col-4">
                <select id="filter-section" class="form-select form-select-sm pokedex-input">
                  <option value="all">Todas Seções</option>
                  <option value="main">National Dex</option>
                  <option value="fullart">Full Art</option>
                  <option value="valuable">Valiosas</option>
                  <option value="cute">Fofos</option>
                </select>
              </div>
              <div class="col-4">
                <input type="number" id="filter-sheet" class="form-control form-select-sm pokedex-input" placeholder="Folha..." min="1">
              </div>
              <div class="col-4">
                <select id="sort-order" class="form-select form-select-sm pokedex-input">
                  <option value="sheet">Folha</option>
                  <option value="price-desc">R$ Maior</option>
                  <option value="recent">Recentes</option>
                </select>
              </div>
            </div>

            <!-- GRID DAS CARTAS -->
            <div id="collection-grid" class="pokedex-grid-scroll"></div>
          </div>
        </div>

      </div>

    </div>
  </div>

  <!-- Firebase Legacy SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="script.js"></script>
</body>
</html>
